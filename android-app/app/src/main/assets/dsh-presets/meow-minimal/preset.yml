name: 极简
description: 极简预设：仅保留持久终端（bash）与文本编辑器（str_replace_editor）的最小工具集——shell 状态（当前目录 / 环境变量 / 后台进程）跨调用保留，可跑交互式命令；无文件读写列表、待办、联网搜索、规划、目标、技能、后台任务与子代理委派。适合观察最简 Agent 的工作方式。
