# 喵仓（meow-academy）组合 —— 安卓 App 内置 DSH jsonrpc 运行时
# stdout 专用于 JSON-RPC 帧：不要加载 console logger 或终端 UI。
# 相比官方 examples/jsonrpc-agent/cordis.yml：
#   - sdk-jsonrpc-server → meow-jsonrpc（自定义插件：包装官方 server 并新增 session/cancel、session/bash）
#   - 去掉 sandbox（landlock 原生模块在 Android 不可加载；App 沙箱兜底）
#   - 保留：llm-deepseek / bash / agent-spine / jsonl 持久化 / 文件工具 / todo / token-meter / compaction
# plan-standard-mode（2026-08-30）：接入 agent-presets 体系 —— 基座挂「注册表/服务」行
#   （presets/commands/goals/skill/user-questions/subagents），模型面工具行随 meow-standard
#   预设组合按会话挂载（preset 系统只对 join 预设的会话生效）。
#
# 布局纪律（照官方 base.cordis.patch.yml + standard preset 的分工）：
#   - 服务/注册表 = 基座（host 平面）：注入在任何会话存在之前就要解析，preset 子树里的
#     isolate realm 实例对外不可见，挂预设里会让基座消费者永远 pending；
#   - 模型面工具行 = 预设组合：注册进基座注册表的作用域层，随会话销毁，决定「这个会话有什么能力」。

- id: meow-jsonrpc
  name: ./meow-extensions/meow-jsonrpc.js
  config:
    maxTokensAsSuccess: true

# 可配置 Provider 机制（模型管理）：settings + credentials 后端 + pi-ai 通用网关
# settings-file 提供 settings service（provider profile 存 settings.json，运行时热生效）
# credentials-local 提供 credentials service（provider apiKey 存 dsh-credentials.yaml）
# llm-pi-ai 承载用户自定义 OpenAI 格式 provider（空 providers = dormant，经 settings 写入才注册）
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: !!js process.env.DSH_SETTINGS_PATH ?? (process.env.DSH_CWD ?? process.cwd()) + '/dsh-settings.json'
    watch: false

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: !!js process.env.DSH_CREDENTIALS_PATH ?? (process.env.DSH_CWD ?? process.cwd()) + '/dsh-credentials.yaml'
    watch: false

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: {}

# DeepSeek 官方直连（key 从 DEEPSEEK_API_KEY 读取，由 App 进程环境注入）
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high

# 图片附件（M5 发图铺路）：官方 attachment-local，sharp 走 @img/sharp-wasm32 WASM 兜底。
# 存储根 = <dshHome>/attachments/v1；dshHome 用 DSH_HOME，未注入则落在 DSH_CWD/.dsh（App workspace 内）。
# imageCompressionConcurrency=1：Termux WASM 解码较慢，串行更稳。
- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.DSH_HOME ?? (process.env.DSH_CWD ?? process.cwd()) + '/.dsh'
    maxImagesPerMessage: 9
    maxMessageImageBytes: 9437184
    normalizedImageMaxDimension: 2048
    imageCompressionConcurrency: 1

# 受管子进程组（bash 执行器底座；Android 上 PATH 含 runtime/bin 与 /system/bin）
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000
    maxOutputBytes: 262144

# 沙箱策略服务（plan-minimal-mode）：极简模式的 terminal-bash 硬 inject sandboxPolicy
# （terminal 家族，packages/terminal/terminal-bash src/index.ts:26）。本部署无 enforcer
# （landlock 原生模块不可加载）→ mode 定 danger-full-access = 「无沙箱」语义：spawnArgv
# 对 full-access 短路直启（terminal-bash src/index.ts:94），不触碰 sandbox enforcer。
# 对现有栈零影响：tool-bash 读 ctx.shell.sandboxMode（bash-local 从不设置 → undefined）
# 不触达本服务；fs-local 无 sandbox 引用；纯 JS 包（仅依赖 schemastery），已随闭包。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access

# 喵喵老师学习助教：persona + agent loop + 工具装配
# 说明：spine 内部无条件挂 jobs 注册表（toolJobs:false 只裁模型面 job 工具）；
# skills.enabled:false 裁掉 spine 内置的 skill 注册表/工具（改由下方 skill 行 + 预设组合提供，
# 以便 skill 工具只随预设会话出现）；goals 不经 spine 开（同样改基座行 + 预设工具行）。
# 记忆系统改造（plan-memory-execution §1.10，2026-09-02）：persona 不再引用 {{soul}}——
# 角色层（<soul>/<user>）与记忆层（<facts>/存储契约）改由 meow-jsonrpc 注册的独立
# `meow:memory` section（order 50）按会话开关注入，并为首条消息固化快照；基座只留
# 环境说明三段（工作区/外观路由/安全边界），任何预设的会话都要。
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: |
      会话工作区：每个会话绑定一个工作目录（首条消息定死，是 App 私有数据目录下 files 的某个工作区文件夹）。读写文件请优先用相对路径（例如 notes/test.txt），也可以用对话中给出的会话内绝对路径；不要读写 /tmp、/sdcard 等系统目录。bash 工具可用于执行命令。

      外观与渲染类诉求（Markdown 样式、代码块/公式/Mermaid 外观、主题颜色、聊天背景等）：请修改 appconfig/ 目录下对应的 *.jsonc 配置文件（例如 markdown-config.jsonc），改完即时生效；不要把 UI 诉求写进 cordis.yml 或代码里。

      安全边界：禁止读取 appconfig/dsh-credentials.yaml 与 datastore/ 目录下的文件（包含密钥与内部数据）；config-defaults/ 是只读默认模板目录，可读取、可复制到 appconfig/ 修改，但不可直接修改；dsh-presets/ 目录是系统预设（只读纪律，不可修改）；.agents/memory/JOURNAL.jsonl 只能经 memory 工具读写（通用文件工具已被拒）；.agents/memory/snapshots/ 是内部快照缓存，不要读写；dsh-settings.json 与 .dsh-sessions/chat.db 可读，但聊天记录含隐私，谨慎引用。
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# ── Agent 预设体系（plan-standard-mode §4.2①）──────────────────────────────
# 注册表/名单服务：list() 每次重扫 roots（自动扫描接口），resolve 失败 fail loud。
# roots = filesDir/dsh-presets（assets 播种，trust: system 只读纪律）；
# includeUserRoot 追加 ${DSH_HOME}/.agent-presets/（用户/AI 自建预设，trust: user）。
# 坑：!!js 在 ESM 作用域无 require，路径只能字符串拼接。
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: meow-standard
    roots:
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/dsh-presets'
        trust: system
    includeUserRoot: true

# 斜杠命令注册表（CommandRuntime）：/plan、/goal、/compact 的前置，命令注册方都 inject 它。
# 官方部署挂 host 平面（注入在会话存在之前解析），preset 内的命令经作用域层遮蔽全局。
- id: commands
  name: '@deepseek-ai/dsh-commands'

# 目标域（goal）：注册表按会话键控，单例服务所有会话；/goal 命令（command-goal）
# inject ['commands','goals']，两者都在基座 → 立即 active。模型面 tool-goal 在预设组合里。
# goal-round-driver：同会话目标轮次驱动（官方 base 同款基座行）。
- id: goals
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

# Skill 注册表：基座单例 + 按作用域分层；预设组合里的 skill-filesystem / tool-skill
# 注册进预设自己的层（官方 standard preset 同款分工）。
- id: skill
  name: '@deepseek-ai/dsh-skill'

# 问答接缝（userQuestions）：单 provider 槽位由 meow-jsonrpc 按连接生命周期注册/释放。
# tool-ask-user（预设组合）与 plan-mode 的计划审阅都经它落到 App 问答卡。
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

# 子代理注册表 + 进程内 spawn 驱动（host 平面单例，官方 base 同款）；
# 委派工具行（tool-subagent / tool-subagent-control）在预设组合里解析这个注册表。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

# 创造模式底座（0.2.6，plan-creative-mode）：动态插件 Host 半边运行器 —— 提供
# dynamicCordisRunner（动态插件注册表/生命周期/VM 执行）与 cordisInspect（inspect
# provider 注册表）两服务，供预设组合里的 tool-cordis 行 inject。服务必须在任何会话
# 存在之前就绪 → host 平面行（官方 web-app bundle 同款分工；vmTimeoutMs 默认 5000ms
# 即插件 apply() 的 VM 预算）。无 Client 半边部署：只装本包、不装 cordis-client-runner/
# ui-cordis —— host-only 包 cordis_run 直接激活不经审批（host-runner src/index.ts:270）。
- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'

# PTC 模式底座（0.2.7，plan-ptc-mode）：Code Mode 执行引擎 —— codeRuntime 服务。
# 官方 CLI 由 bundle patch 挂 host 平面（packages/bundle/headless/cordis.patch.yml:25），
# 官方 code 预设组合不含此行、只「等待宿主的 codeRuntime」→ 喵仓同样挂基座：
# 只有会话挂了 tool-presentation 行（meow-code 预设）才消费它，其余会话零影响。
# 资源预算（worker_threads）：computeMs/maxWallMs/maxOutputBytes 走默认（60s/600s/64MB），
# maxOldGenerationSizeMb 默认 512 按安卓调低到 128（会议笔记 §8.2；真机 §9.1 已验 128 可用）。
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'
  config:
    maxOldGenerationSizeMb: 128

# 会话持久化：SQLite backend（node:sqlite，无原生依赖）。规避 jsonl 的 link() 在 Android
# SELinux 下 EACCES 的问题；session-checkpoints 提供模型请求/工具调用边界的语义 checkpoint。
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-sqlite'
  config:
    path: !!js process.env.DSH_SESSION_DB ?? (process.env.DSH_CWD ?? process.cwd()) + '/.dsh-sessions/chat.db'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 网络搜索（DeepSeek 官方 web_search，复用 DEEPSEEK_API_KEY）；DSH_WEB_SEARCH 环境变量开关
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: !!js process.env.DSH_WEB_SEARCH === '1'
    fetch: false

# 文件能力（M4 文件管理铺路）
# phase4：deny 规则禁止 agent 读取敏感文件（凭证 / DataStore 内部明文 key）。
# 用 DSH_FILES_DIR 构造绝对路径，避免 cwd=workspace 时相对基准错误；文件级精确 + 目录级前缀。
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    deny:
      # 注意：loader 的 !!js 在 ESM 作用域求值，require 不可用；用字符串拼接构造绝对路径
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/appconfig/dsh-credentials.yaml'
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/datastore/meow_settings.preferences_pb'
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/datastore/meow_settings.preferences_pb.journal'
      # 默认配置模板目录只读（docs/design-dynamic-config.md）：AI 可读可复制，不可修改
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/config-defaults'
      # 系统预设目录只读（plan-standard-mode §4.2④）：预设由 APK assets 播种，AI 改坏会
      # 毒化所有新会话；改预设走 roster.copy() 到用户根（host 平面 RPC，不受 deny 影响）
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/dsh-presets'
      # 记忆日志（plan-memory-execution §4.3）：JOURNAL.jsonl 是 append-only 结构化日志，
      # 只允许 memory 工具 append/search。memory 工具用 node:fs 直连读写、不经本服务，
      # 故这条 deny 只挡通用文件工具（read/write/edit/str_replace_editor）——双保险的硬约束半边。
      - path: !!js (process.env.DSH_FILES_DIR ?? process.cwd()) + '/.agents/memory/JOURNAL.jsonl'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# 基座 compaction：为「未 join 任何预设的裸会话」（升级前旧会话）保留的兜底策略。
# join meow-standard 的会话由预设组合里的 compaction 组（basic + pruner + command-compact，
# 同参数）按作用域遮蔽此处。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
