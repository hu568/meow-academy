# 喵学堂（meow-academy）组合 —— 安卓 App 内置 DSH jsonrpc 运行时
# stdout 专用于 JSON-RPC 帧：不要加载 console logger 或终端 UI。
# 相比官方 examples/jsonrpc-agent/cordis.yml：
#   - sdk-jsonrpc-server → meow-jsonrpc（自定义插件：包装官方 server 并新增 session/cancel、session/bash）
#   - 去掉 subagent 全家桶、sandbox（landlock 原生模块在 Android 不可加载；App 沙箱兜底）
#   - 保留：llm-deepseek / bash / agent-spine / jsonl 持久化 / 文件工具 / todo / token-meter / compaction

- id: meow-jsonrpc
  name: ./meow-extensions/meow-jsonrpc.js
  config:
    maxTokensAsSuccess: true

# DeepSeek 官方直连（key 从 DEEPSEEK_API_KEY 读取，由 App 进程环境注入）
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high

# 受管子进程组（bash 执行器底座；Android 上 PATH 含 runtime/bin 与 /system/bin）
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000
    maxOutputBytes: 262144

# 喵喵老师学习助教：persona + agent loop + 工具装配
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是一位温柔耐心的学习助教「喵喵老师」。回答要清晰有条理，适当使用 Markdown 格式，引用知识库时标注来源。'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# 会话持久化：JSONL backend 用 link() 做原子发布，Android SELinux 禁 link()（EACCES），
# 已移除（内存会话，重启不保留历史）；M3 改用 SQLite backend 或 patch link→rename 恢复持久化。

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 文件能力（M3 文件管理铺路）
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
